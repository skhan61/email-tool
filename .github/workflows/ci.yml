name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  MCPB: "@anthropic-ai/mcpb@2.1.2"
  CODEX: "@openai/codex@0.160.1"

# GitHub-hosted runners only. A self-hosted runner on a public repository runs
# any stranger's pull request on your machine.
jobs:
  lint:
    name: hooks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      # no-commit-to-branch fires on a push to main, where CI commits nothing.
      - run: SKIP=no-commit-to-branch uv run --no-sync pre-commit run --all-files --show-diff-on-failure

  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # macOS and Windows minutes are billed on a private repository, free once public.
        os: ${{ fromJSON(github.event.repository.private && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest", "windows-latest"]') }}
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv run --locked pytest -q

  build:
    name: package build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  bundle:
    name: Claude Desktop bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: npx -y "$MCPB" validate manifest.json
      - run: npx -y "$MCPB" pack . "$RUNNER_TEMP/email-tool.mcpb"
      - run: unzip -q "$RUNNER_TEMP/email-tool.mcpb" -d "$RUNNER_TEMP/bundle"
      - name: Launch the unpacked bundle with the manifest's own command
        run: EMAIL_TOOL_BUNDLE_DIR="$RUNNER_TEMP/bundle" uv run --locked pytest -q tests/test_bundle.py

  codex-plugin:
    name: ChatGPT / Codex plugin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CODEX_HOME: ${{ github.workspace }}/../codex-home
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: npm install -g "$CODEX" && mkdir -p "$CODEX_HOME"
      - name: Install the plugin from this checkout with the real Codex CLI
        run: |
          set -euo pipefail
          codex plugin marketplace add "$GITHUB_WORKSPACE"
          codex plugin add email-tool@email-tool
          codex plugin list | grep -E "email-tool@email-tool +installed, enabled"
          codex mcp get email --json > "$RUNNER_TEMP/codex-email.json"
      - name: Launch the server Codex registered (built from this checkout) and list its tools
        run: >-
          EMAIL_TOOL_CODEX_SERVER="$RUNNER_TEMP/codex-email.json" EMAIL_TOOL_CODEX_FROM="$GITHUB_WORKSPACE"
          uv run --locked pytest -q tests/test_codex_plugin.py
