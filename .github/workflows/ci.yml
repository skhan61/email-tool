name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# GitHub-hosted runners only. A self-hosted runner on a public repository runs
# any stranger's pull request on your machine.
jobs:
  lint:
    name: hooks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked
      # no-commit-to-branch fires on a push to main, where CI commits nothing.
      - run: SKIP=no-commit-to-branch uv run --no-sync pre-commit run --all-files --show-diff-on-failure

  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Every Python on Linux; the oldest and newest on macOS and Windows.
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - { os: macos-latest, python: "3.11" }
          - { os: macos-latest, python: "3.14" }
          - { os: windows-latest, python: "3.11" }
          - { os: windows-latest, python: "3.14" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv run --locked pytest -q

  build:
    name: package build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  bundle:
    name: Claude Desktop bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: ./.github/actions/agent-cli
        with:
          tool: mcpb
          scripts: "false"
      - run: mcpb validate manifest.json
      - run: mcpb pack . "$RUNNER_TEMP/email-tool.mcpb"
      - run: unzip -q "$RUNNER_TEMP/email-tool.mcpb" -d "$RUNNER_TEMP/bundle"
      - name: Launch the unpacked bundle with the manifest's own command
        run: EMAIL_TOOL_BUNDLE_DIR="$RUNNER_TEMP/bundle" uv run --locked pytest -q tests/test_bundle.py

  codex-plugin:
    name: ChatGPT / Codex plugin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CODEX_HOME: ${{ github.workspace }}/../codex-home
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: ./.github/actions/agent-cli
        with:
          tool: codex
      - run: mkdir -p "$CODEX_HOME"
      - name: Install the plugin from this checkout with the real Codex CLI
        run: |
          set -euo pipefail
          codex plugin marketplace add "$GITHUB_WORKSPACE"
          codex plugin add email-tool@email-tool
          codex plugin list | grep -E "email-tool@email-tool +installed, enabled"
          codex mcp get email --json > "$RUNNER_TEMP/codex-email.json"
      - name: Launch the server Codex registered (built from this checkout) and list its tools
        run: >-
          EMAIL_TOOL_CODEX_SERVER="$RUNNER_TEMP/codex-email.json" EMAIL_TOOL_CODEX_FROM="$GITHUB_WORKSPACE"
          uv run --locked pytest -q tests/test_codex_plugin.py

  claude-plugin:
    name: Claude Code plugin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: ./.github/actions/agent-cli
        with:
          tool: claude-code
      - name: Validate the plugin and marketplace with Claude Code's own checker
        run: claude plugin validate .
      - name: Launch the plugin's server with Claude Code's command and list its tools
        run: EMAIL_TOOL_CLAUDE_PLUGIN=1 uv run --locked pytest -q tests/test_claude_plugin.py
