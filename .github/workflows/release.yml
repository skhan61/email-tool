# Push a tag `vX.Y.Z` (matching pyproject.toml) to publish a GitHub release
# carrying the wheel, the sdist and the Claude Desktop bundle, each signed with
# Sigstore (`*.sigstore.json`), plus SLSA build provenance (`*.intoto.jsonl`).
# With the repository variable PYPI_PUBLISH set to "true", the wheel and sdist
# also go to PyPI by trusted publishing (no token stored anywhere).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      hashes: ${{ steps.hashes.outputs.hashes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # main only takes merged PRs that passed the full CI matrix.
      - name: Tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Tag matches the package version
        run: test "${GITHUB_REF_NAME#v}" = "$(uv version --short)"
      - run: uv run --locked pytest -q
      - run: uv build
      - uses: ./.github/actions/agent-cli
        with:
          tool: mcpb
          scripts: "false"
      - run: mcpb pack . "dist/email-tool-${GITHUB_REF_NAME#v}.mcpb"
      # What the provenance vouches for: the SHA-256 of every file released.
      - id: hashes
        run: echo "hashes=$(cd dist && sha256sum * | base64 -w0)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  # Provenance first, so the release is published once, with every file attached.
  provenance:
    needs: build
    # The generator's own upload job declares contents: write even with upload-assets
    # off, and a called workflow may not ask for more than this job grants. That write
    # grant goes to a third-party workflow referenced by tag (below), so a moved or
    # compromised v2.1.0 tag could use it; SLSA allows no hash pin. Scorecard lists it.
    # A tag push is the first time this file runs, so release-workflow changes need a
    # dry run before tagging (tracked for v5.2).
    permissions:
      actions: read
      id-token: write
      contents: write
    # Referenced by tag, not hash: the generator verifies its own ref (SLSA's documented use).
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.build.outputs.hashes }}
      upload-assets: false

  github-release:
    needs: [build, provenance]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      # Sigstore signs with a short-lived certificate for this workflow's identity.
      id-token: write
    steps:
      # Checkout first: it cleans the workspace, which would delete the downloaded dist/.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: CHANGELOG.md
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.provenance.outputs.provenance-name }}
          path: dist/
      - uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: ./dist/*.whl ./dist/*.tar.gz ./dist/*.mcpb
      # The CHANGELOG section for this version, then GitHub's list of merged PRs.
      - run: awk -v v="## ${GITHUB_REF_NAME#v}" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
      - run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --notes-file notes.md --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  pypi:
    needs: github-release
    # Off until the PyPI trusted publisher exists (#31); then set the variable to "true".
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: pypi
      url: https://pypi.org/project/email-tool-mcp/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      # PyPI takes the wheel and the sdist only.
      - run: rm -f dist/*.mcpb
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
