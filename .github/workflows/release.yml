# Merging a release pull request publishes it. On every push to main, the `version` job reads
# pyproject.toml; when tag `v<version>` exists already (an ordinary merge), every other job
# is skipped. When it does not (a release PR made by `python -m tools.release prepare` just
# merged), the build runs, the `tag` job tags the commit, and the same run publishes a GitHub
# release carrying the wheel, the sdist and the Claude Desktop bundle, each signed with
# Sigstore (`*.sigstore.json`), plus SLSA build provenance (`*.intoto.jsonl`).
# With the repository variable PYPI_PUBLISH set to "true", the wheel and sdist
# also go to PyPI by trusted publishing (no token stored anywhere), then server.json
# to the official MCP Registry (GitHub OIDC, no secret).
#
# Pushing a tag `vX.Y.Z` (matching pyproject.toml, on main) by hand still releases it: the
# fallback when the automatic run cannot be re-run.
#
# A pull request that changes this workflow runs it as a dry run: GitHub checks every job,
# skipped ones included (their permissions, the workflows they call), when the run starts,
# so a mistake fails the pull request instead of the release. The dry run builds and packs;
# it does not tag, check a tag, sign, generate provenance or publish.
name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/actions/agent-cli/**
      - .github/tools/mcpb/**
      - pyproject.toml
      - manifest.json
      - server.json

permissions:
  contents: read

jobs:
  # What this run releases, if anything: `publish` is "true" for a version with no tag yet on
  # main, and for a tag push. Read with the runner's Python, so no third-party code runs here.
  # `tagged` is "true" when "Re-run all jobs" repeats a release whose tag this commit already has
  # and whose GitHub release does not exist yet: the run finishes that release instead of skipping.
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.read.outputs.version }}
      publish: ${{ steps.read.outputs.publish }}
      tagged: ${{ steps.read.outputs.tagged }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: read
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          publish=false
          tagged=false
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            publish=true
          elif [ "$GITHUB_EVENT_NAME" = push ]; then
            # --exit-code: 0 the tag exists, 2 it does not; anything else is an error, not "missing".
            found=0
            refs="$(git ls-remote --exit-code --tags origin "refs/tags/v$version")" || found=$?
            case "$found" in
              0)
                if [ "$GITHUB_RUN_ATTEMPT" -gt 1 ] && grep -q "^$GITHUB_SHA" <<< "$refs" \
                    && ! gh release view "v$version" --repo "$GITHUB_REPOSITORY" > /dev/null; then
                  publish=true
                  tagged=true
                fi ;;
              2) publish=true ;;
              *) echo "::error::cannot list the repository's tags (git exit $found)"; exit 1 ;;
            esac
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "tagged=$tagged" >> "$GITHUB_OUTPUT"
          echo "version $version, publish $publish, tagged $tagged"
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: version
    if: github.event_name == 'pull_request' || needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      hashes: ${{ steps.hashes.outputs.hashes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      # main only takes merged PRs that passed the full CI matrix.
      - name: Tag is on main
        if: github.ref_type == 'tag'
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Tag matches the package version
        if: github.ref_type == 'tag'
        run: test "${GITHUB_REF_NAME#v}" = "$(uv version --short)"
      - run: uv run --locked pytest -q
      # Built outside the checkout, so the bundle below never packs them. Checked with the twine
      # and pins that gh-action-pypi-publish v1.14.2 runs, so a pull request's dry run fails on
      # anything PyPI would refuse.
      - run: uv build --out-dir "$RUNNER_TEMP/python"
      - run: uvx --constraints .github/tools/twine/constraints.txt twine check --strict "$RUNNER_TEMP"/python/*
      - run: mkdir -p dist && cp "$RUNNER_TEMP"/python/* dist/
      - uses: ./.github/actions/agent-cli
        with:
          tool: mcpb
          scripts: "false"
      - run: mcpb pack . "dist/email-tool-$(uv version --short).mcpb"
      # The same bundle under a fixed name, so one link always downloads the newest:
      # https://github.com/skhan61/email-tool/releases/latest/download/email-tool.mcpb
      - run: cp "dist/email-tool-$(uv version --short).mcpb" dist/email-tool.mcpb
      # Double-click installers for ChatGPT desktop. The macOS one ships in a zip, which keeps
      # its "can run" permission; a browser strips it from a bare .command download.
      - run: cp install/Install-email-tool.cmd dist/
      - run: cd install && zip -X ../dist/Install-email-tool-macOS.zip Install-email-tool.command
      # The pypi job keeps the wheel and sdist formats from dist; that must be exactly what uv built.
      - run: diff <(cd "$RUNNER_TEMP/python" && ls) <(cd dist && ls -- *.whl *.tar.gz)
      # What the provenance vouches for: the SHA-256 of every file released.
      - id: hashes
        run: echo "hashes=$(cd dist && sha256sum * | base64 -w0)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  # A release PR just merged: tag its commit with this workflow's token, after the tests passed.
  # An event the GITHUB_TOKEN causes starts no new workflow run (except workflow_dispatch and
  # repository_dispatch; GitHub docs, "GITHUB_TOKEN"), so this tag does not start the
  # `push: tags` release again: the release continues in this run. `proceed` is "false" when the
  # tag appeared after the `version` job looked (pushed by hand, or by a run for a later merge):
  # the run that tag started, or that later run, releases it, and this one stops without failing.
  tag:
    if: github.event_name == 'push'
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      proceed: ${{ steps.create.outputs.proceed }}
    steps:
      - id: create
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ] || [ "$TAGGED" = true ]; then
            proceed=true
          elif gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/v$VERSION" -f sha="$GITHUB_SHA" > /dev/null; then
            proceed=true
          elif gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" > /dev/null; then
            echo "::notice::v$VERSION was tagged by another push; that run releases it"
            proceed=false
          else
            exit 1
          fi
          echo "proceed=$proceed" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          TAGGED: ${{ needs.version.outputs.tagged }}

  # Provenance first, so the release is published once, with every file attached.
  provenance:
    if: github.event_name == 'push' && needs.tag.outputs.proceed == 'true'
    needs: [build, tag]
    # The generator's own upload job declares contents: write even with upload-assets
    # off, and a called workflow may not ask for more than this job grants. That write
    # grant goes to a third-party workflow referenced by tag (below), so a moved or
    # compromised v2.1.0 tag could use it; SLSA allows no hash pin. Scorecard lists it.
    # Not tied to a tag: with upload-assets off it runs on a branch push too (the generator's
    # README), and the provenance records the ref the run had, refs/heads/main or the tag.
    permissions:
      actions: read
      id-token: write
      contents: write
    # Referenced by tag, not hash: the generator verifies its own ref (SLSA's documented use).
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.build.outputs.hashes }}
      upload-assets: false

  github-release:
    if: github.event_name == 'push'
    needs: [version, build, provenance]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VERSION: ${{ needs.version.outputs.version }}
    permissions:
      contents: write
      # Sigstore signs with a short-lived certificate for this workflow's identity.
      id-token: write
    steps:
      # Checkout first: it cleans the workspace, which would delete the downloaded dist/.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: CHANGELOG.md
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.provenance.outputs.provenance-name }}
          path: dist/
      - uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: ./dist/*.whl ./dist/*.tar.gz ./dist/*.mcpb ./dist/Install-email-tool.cmd ./dist/*.zip
      # The CHANGELOG section for this version, then GitHub's list of merged PRs.
      - run: awk -v v="## $VERSION" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
      # --verify-tag: release the tag the `tag` job (or a hand push) made; never create one here.
      - run: gh release create "v$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --notes-file notes.md --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  pypi:
    needs: github-release
    # Off until the PyPI trusted publisher exists (#31); then set the variable to "true".
    if: github.event_name == 'push' && vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: pypi
      url: https://pypi.org/project/email-tool-mcp/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      # The signed release's own files; PyPI takes its two package formats, wheel and sdist.
      - run: find dist -type f ! -name '*.whl' ! -name '*.tar.gz' -delete && ls dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  # The official MCP Registry lists the PyPI package; it checks the README's mcp-name marker.
  mcp-registry:
    needs: pypi
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    env:
      PUBLISHER: https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
      PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          curl -sSfL "$PUBLISHER" -o publisher.tar.gz
          echo "$PUBLISHER_SHA256  publisher.tar.gz" | sha256sum --check
          tar xzf publisher.tar.gz mcp-publisher
      - run: ./mcp-publisher login github-oidc
      # The registry reads the new version from PyPI, which can lag the upload by a minute or two.
      - run: |
          for attempt in 1 2 3 4 5 6; do
            ./mcp-publisher publish && exit 0
            echo "attempt $attempt failed; PyPI may not serve the new version yet"
            sleep 30
          done
          exit 1

  # On a pull request, the registry checks server.json as it would at release.
  registry-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PUBLISHER: https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
      PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          curl -sSfL "$PUBLISHER" -o publisher.tar.gz
          echo "$PUBLISHER_SHA256  publisher.tar.gz" | sha256sum --check
          tar xzf publisher.tar.gz mcp-publisher
      - run: ./mcp-publisher validate
