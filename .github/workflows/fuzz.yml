name: fuzz

# Coverage-guided fuzzing (Atheris) of the parsers that read mail and files from strangers:
# fuzz/fuzz_attachment_text.py and fuzz/fuzz_message.py. A crash, a hang over 10 s or more
# than 2 GB of memory fails the job and uploads the input that caused it.
on:
  pull_request:
    paths: ["src/**", "fuzz/**", "pyproject.toml", "uv.lock", ".github/workflows/fuzz.yml"]
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [fuzz_attachment_text, fuzz_message]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      # Atheris 3.0.0 ships wheels for Python 3.11 to 3.13.
      - run: uv sync --locked --group fuzz --python 3.13
      - run: mkdir findings
      - run: >-
          uv run --no-sync python fuzz/${{ matrix.target }}.py
          -max_total_time=300 -timeout=10 -rss_limit_mb=2048 -artifact_prefix=findings/
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: findings-${{ matrix.target }}
          path: findings/
