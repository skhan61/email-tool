name: fuzz

# Coverage-guided fuzzing (Atheris) of the parsers that read mail and files from strangers:
# fuzz/fuzz_attachment_text.py and fuzz/fuzz_message.py, and of the problem-report redaction
# (fuzz/fuzz_report.py). A crash, a hang over 10 s or more
# than 2 GB of memory fails the job and uploads the input that caused it.
on:
  pull_request:
    paths: ["src/**", "fuzz/**", "pyproject.toml", "uv.lock", ".github/workflows/fuzz.yml"]
  push:
    branches: [main]
    paths: ["src/**", "fuzz/**", "pyproject.toml", "uv.lock", ".github/workflows/fuzz.yml"]
  schedule:
    - cron: "17 6 * * 1"

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [fuzz_attachment_text, fuzz_message, fuzz_report]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      # Atheris 3.1.0 ships wheels for Python 3.12 to 3.14 on Linux x86_64.
      - run: uv sync --locked --group fuzz --python 3.13
      - run: mkdir findings
      - run: >-
          uv run --no-sync python -m fuzz.${{ matrix.target }}
          -max_total_time=300 -timeout=10 -rss_limit_mb=2048 -artifact_prefix=findings/
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: findings-${{ matrix.target }}
          path: findings/
