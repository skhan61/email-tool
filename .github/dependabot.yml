version: 2
# Grouped weekly PRs, and nothing younger than 14 days: a fresh release gets two
# weeks for regressions and yanks to surface first. Runtime and dev bumps stay in
# separate PRs so a breaking runtime release cannot block tooling updates.
# The pre-commit-hooks rev is not covered; bump it with `pre-commit autoupdate`.
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      runtime:
        dependency-type: production
      dev:
        dependency-type: development
  - package-ecosystem: npm
    directories: [/.github/tools/mcpb, /.github/tools/codex, /.github/tools/claude-code]
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      agent-clis:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
