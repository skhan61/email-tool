[project]
name = "email-tool-mcp"
version = "5.4.0"
description = "IMAP/SMTP email for any MCP client: read, search, draft and send mail."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Sayem Khan", email = "s.khan@alchlight.com" }]
maintainers = [{ name = "Sayem Khan", email = "s.khan@alchlight.com" }]
dependencies = [
    "filelock==4.0.12",
    "cryptography==50.0.2",
    "fire==0.7.1",
    "google-auth==2.61.0",
    "google-auth-oauthlib==1.5.0",
    "imapclient==4.1.0",
    "keyring==25.7.0",
    "msal==1.39.0",
    "pypdf==6.21.1",
    "mcp==2.3.0",
    "mcp-types==2.3.0",
    "platformdirs==4.12.4",
    "pydantic==2.14.0",
    # tls.py mounts its own HTTPS adapter (TLS context, timeout) for MSAL and google-auth.
    "requests==2.34.2",
    "tomli-w==1.2.0",
]

[project.scripts]
email-tool-mcp = "email_tool_mcp.__main__:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/email_tool_mcp"]

[dependency-groups]
# The pre-commit hooks run these exact versions.
dev = [
    # Property-based (fuzz) tests in tests/test_fuzz.py.
    "hypothesis==6.168.5",
    "mypy==2.4.0",
    "pre-commit==4.6.2",
    # `tools.bot_pr` signs in as the GitHub App that opens this repository's issues and PRs.
    "pygithub==2.10.0",
    "pytest==9.1.1",
    "pytest-timeout==2.5.0",
    # `tools.clean_install` checks the install steps on a clean home and saves each one's real
    # terminal output as SVG for docs/.
    "rich==13.9.4",
    "ruff==0.16.10",
]

# Coverage-guided fuzzing of the mail and file parsers (fuzz/, .github/workflows/fuzz.yml).
# Atheris 3.0.0 ships wheels for Python 3.11 to 3.13.
fuzz = [
    "atheris==3.0.0",
]

# The documentation site (mkdocs.yml, docs/): `uv run --group docs mkdocs serve`.
docs = [
    "mkdocs==1.6.1",
    "mkdocs-material==9.7.7",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "T201"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests", "tools", "fuzz"]

[[tool.mypy.overrides]]
# None of these ships type information.
module = ["atheris", "fire", "google_auth_oauthlib", "google_auth_oauthlib.*", "imapclient", "imapclient.*", "msal", "msal.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# google-auth ships py.typed, but Credentials.to_json/refresh/from_authorized_user_info
# and jwt.decode are unannotated; only google.py and its tests call them.
module = ["email_tool_mcp.google", "tests.test_google"]
disallow_untyped_calls = false

# The bot that opens the maintainer's PRs. Its App ID and key are machine settings
# (~/.config/github-apps/bot.toml), never in the repository.
[tool.bot_pr]
bot_login = "skhan61-bot[bot]"

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--strict-markers --durations=10"
markers = [
    "live: runs against this computer's real mailboxes; skipped unless EMAIL_TOOL_LIVE=1 (tests/live)",
]
# A hung test prints every thread's stack and fails instead of stalling CI.
timeout = 60
timeout_method = "thread"
testpaths = ["tests"]
