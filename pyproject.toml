[project]
name = "email-tool-mcp"
version = "5.0.0"
description = "IMAP/SMTP email for any MCP client: read, search, draft and send mail."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Sayem Khan", email = "sayem.eee.kuet@gmail.com" }]
maintainers = [{ name = "Sayem Khan", email = "s.khan@alchlight.com" }]
dependencies = [
    "filelock==4.0.12",
    "fire==0.7.1",
    "imapclient==4.1.0",
    "keyring==25.7.0",
    "mcp==2.3.0",
    "mcp-types==2.3.0",
    "platformdirs==4.12.3",
    "pydantic==2.13.5",
    "tomli-w==1.2.0",
]

[project.scripts]
email-tool-mcp = "email_tool_mcp.__main__:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/email_tool_mcp"]

[dependency-groups]
# The pre-commit hooks run these exact versions.
dev = [
    "mypy==2.4.0",
    "pre-commit==4.6.2",
    # `tools.bot_pr` signs in as the GitHub App that opens this repository's issues and PRs.
    "pygithub==2.8.1",
    "pytest==9.1.1",
    "pytest-timeout==2.5.0",
    "ruff==0.16.10",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "T201"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests", "tools"]

[[tool.mypy.overrides]]
# Neither ships type information.
module = ["fire", "imapclient", "imapclient.*"]
ignore_missing_imports = true

# The shared app (skhan61-bot, installed on every repository) is described once in
# ~/.config/github-apps/bot.toml; this login is what the PR route hook checks.
[tool.bot_pr]
bot_login = "skhan61-bot[bot]"

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--strict-markers --durations=10"
# A hung test prints every thread's stack and fails instead of stalling CI.
timeout = 60
timeout_method = "thread"
testpaths = ["tests"]
