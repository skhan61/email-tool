[project]
name = "email-tool-mcp"
version = "4.0.0"
description = "IMAP/SMTP email for any MCP client: read, search, draft and send mail."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Sayem Khan" }]
dependencies = [
    "fire==0.7.1",
    "imapclient==4.1.0",
    "keyring==25.7.0",
    "mcp==2.3.0",
    "mcp-types==2.3.0",
    "platformdirs==4.12.3",
    "pydantic==2.13.5",
    "tomli-w==1.2.0",
]

[project.scripts]
email-tool-mcp = "email_tool_mcp.__main__:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/email_tool_mcp"]

[dependency-groups]
# The pre-commit hooks run these exact versions.
dev = [
    "mypy==2.4.0",
    "pre-commit==4.6.2",
    "pytest==9.1.1",
    "ruff==0.16.10",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "T201"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]

[[tool.mypy.overrides]]
# Neither ships type information.
module = ["fire", "imapclient", "imapclient.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--strict-markers"
testpaths = ["tests"]
