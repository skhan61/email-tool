# Install once per clone: `uv sync` then `uv run pre-commit install`.
# CI runs the same file with `pre-commit run --all-files`.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: no-commit-to-branch
        args: [--branch, main]
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: debug-statements
      - id: detect-private-key

  # ruff and mypy come from uv.lock, so Dependabot bumps one pin, not two.
  # `--no-sync`: a plain `uv run` would re-sync the environment mid-commit.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --no-sync ruff check --force-exclude
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run --no-sync ruff format --force-exclude
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy --strict
        entry: uv run --no-sync mypy
        language: system
        types: [python]
        pass_filenames: false
